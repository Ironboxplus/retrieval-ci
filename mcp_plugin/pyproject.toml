[project]
name = "retrieval-mcp"
version = "0.5.15"
description = "Installable MCP server for the Retrieval API: academic-paper search + journal memory + ACE playbook + semantic code search"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "retrieval", "papers", "search", "llm", "ace", "code-search"]
dependencies = [
    "mcp>=1.29,<1.30",
    "httpx[socks]>=0.27",
    "chonkie[code]>=1.6,<1.7",
    "tree-sitter-language-pack>=1.8,<1.13",
    "tree-sitter>=0.23,<0.26",
    "tomli>=2.0; python_version < '3.11'",
    "watchfiles>=1.1",
    # Compresses index_code/index_dir uploads (19.3 MiB -> 2.2 MiB at level 3) and
    # makes httpx advertise zstd so replies come back compressed too. Optional at
    # runtime: without it the client just sends plain JSON, as 0.4.8 does.
    "zstandard>=0.22",
    # POSIX liveness check: os.kill(pid, 0) succeeds for an exited-but-unreaped daemon,
    # so `retrieval-mcp stop` could not tell a zombie from a live process.
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://retrieval.rnarket.com"

[project.scripts]
retrieval-mcp = "retrieval_mcp_cli:main"

[build-system]
# Upper-bounded deliberately.  An unpinned `hatchling` makes the artifact a
# function of the build DATE, not of this source tree: on 2026-09-02 the
# isolated build env resolved hatchling 1.31.0, which emits
# `Metadata-Version: 2.5`, and `twine check` rejected the wheel outright
# (packaging 25.0 accepts at most 2.4).  Every published release so far —
# 0.4.6 and 0.4.7 — shipped 2.4.  Raising this bound requires rebuilding and
# re-running `twine check` first, because the metadata version is a
# publishability contract with PyPI, not an implementation detail.
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["retrieval_mcp.py", "retrieval_mcp_cli.py", "retrieval_mcp_daemon.py", "retrieval_mcp_conversations.py"]

[tool.hatch.build.targets.wheel.sources]
"retrieval_mcp.py" = "retrieval_mcp.py"
"retrieval_mcp_cli.py" = "retrieval_mcp_cli.py"
"retrieval_mcp_daemon.py" = "retrieval_mcp_daemon.py"
"retrieval_mcp_conversations.py" = "retrieval_mcp_conversations.py"
