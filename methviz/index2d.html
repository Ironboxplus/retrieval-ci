const P=DATA.points, PAIRS=DATA.pairs, CL=DATA.clusters, DC=DATA.domainColors;
const clById={}; CL.forEach(c=>clById[c.id]=c);
const clabel=id=>(clById[id]&&clById[id].methodology)||("簇"+id);
const ccolor=id=>(clById[id]&&clById[id].color)||"#888";
let mode="cluster"; // cluster | domain
let sortMode="mm";
const col=p=> mode==="domain" ? (DC[p.d]||"#888") : ccolor(p.c);
// convergence z graft
(function(){const by={};const dp=x=>{const a=P[x.a].d,b=P[x.b].d;return a<b?a+"|"+b:b+"|"+a;};
 PAIRS.forEach(x=>{(by[dp(x)]=by[dp(x)]||[]).push(x.mm);});const st={};
 for(const k in by){const v=by[k];const mu=v.reduce((s,t)=>s+t,0)/v.length;const sd=Math.sqrt(v.reduce((s,t)=>s+(t-mu)*(t-mu),0)/v.length);st[k]={mu,sd};}
 PAIRS.forEach(x=>{const s=st[dp(x)];x.z=s.sd>1e-9?(x.mm-s.mu)/s.sd:0;});})();

function scatterData(){return P.map((p,i)=>({value:p.v,itemStyle:{color:col(p)},info:i}));}

function baseOption(){return{

let curC=[];
function confirmed(thr){return PAIRS.filter(x=>x.mm>=thr);}
function update(thr){
 const key=sortMode==="z"?"z":"mm";

 document.getElementById("cnt").textContent=c.length;

 document.getElementById("disc").innerHTML=c.slice(0,80).map(x=>{const A=P[x.a],B=P[x.b];

 try{chart.setOption({series:[{},{},{data:c.map(x=>({coords:[P[x.a].v,P[x.b].v]}))},{}]},{lazyUpdate:false});}

}

 };});}
