// GRAFT (self-bootstrap): phylogenetic convergence statistic (Wheatsheaf / Stayton).
// Convergence ≠ raw similarity; it's similarity ABOVE what the lineage-distance predicts.
// "Lineage distance" here = the domain pair. Standardise each pair's mech-sim against its
// own domain-pair distribution so a match only counts if it beats that domain-pair's baseline.
(function computeConvergence(){
  const by={};
  const dp=x=>{const a=P[x.a].d,b=P[x.b].d;return a<b?a+"|"+b:b+"|"+a;};
  PAIRS.forEach(x=>{(by[dp(x)]=by[dp(x)]||[]).push(x.mm);});
  const stat={};
  for(const k in by){const v=by[k];const mu=v.reduce((s,t)=>s+t,0)/v.length;
    const sd=Math.sqrt(v.reduce((s,t)=>s+(t-mu)*(t-mu),0)/v.length);stat[k]={mu,sd};}
  PAIRS.forEach(x=>{const s=stat[dp(x)];x.excess=x.mm-s.mu;x.z=s.sd>1e-9?(x.mm-s.mu)/s.sd:0;});
})();

function update(thr){

 try{
   chart.setOption({series:[{},{data:c.map(x=>({coords:[P[x.a].v,P[x.b].v]}))}]},{lazyUpdate:false});

}

}
