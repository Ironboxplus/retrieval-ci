[pytest]
testpaths = tests
markers =
    network: tests that require live external network access
    gpu88: tests that need the RTX 4070 SUPER of the .88 host and run only there (PVL_GPU88=1)
    needs_dev_data: tests that read gitignored harvested data (e.g. the KDD 2026 manifest) only a dev box holds
    needs_camoufox: tests that need the camoufox package and its Firefox build, a dev-box install requirements.txt does not declare
    needs_marker_pdf: tests that need the marker-pdf package, which cannot be co-installed with browser-use (pillow pins conflict)
    needs_cuda: tests that move a real model onto the product's default CUDA device and need a CUDA build of torch
