Andrew Pavlo", "Paper ID": "vol18/p1-arch", "Paper Title": "The Key to Effective UDF Optimization: Before Inlining, First Perform Outlining", "Abstract": "Although user-defined functions (UDFs) are a popular way to aug- ment SQL’s declarative approach with procedural code, the mis- match between programming paradigms creates a fundamental optimization challenge. UDF inlining automatically removes all UDF calls by replacing them with equivalent SQL subqueries. Al- though inlining leaves queries entirely in SQL (resulting in large performance gains), we observe that inlining the entire UDF often leads to sub-optimal performance. A better approach is to analyze the UDF, deconstruct it into smaller pieces, and inline only the pieces that help query optimization. To achieve this, we propose UDF outlining, a technique to intentionally hide pieces of a UDF from the optimizer, resulting in simpler UDFs and significantly faster query plans. Our implementation (PRISM) demonstrates that UDF outlining improves performance over conventional inlining (on average 1.29× speedup for DuckDB and 298.73× for SQL Server) through a combination of more effective unnesting, improved data skipping, and by avoiding unnecessary joins.", "Artificats": "yes"}, {"Author Names": "Milad Rezaei Hajidehi, Sraavan Sridhar, Margo Seltzer", "Paper ID": "vol18/p14-hajidehi", "Paper Title": "CUTTANA: Scalable Graph Partitioning for Faster Distributed Graph Databases and Analytics", "Abstract": "Graph partitioning plays a pivotal role in various distributed graph processing applications, including graph analytics, graph neural network training, and distributed graph databases. A “good” graph partitioner reduces workload execution time, worker imbalance, and network overhead. Graphs that require distributed settings are often too large to fit in the main memory of a single machine. This challenge renders traditional in-memory graph partitioners infea- sible, leading to the emergence of streaming solutions. Streaming partitioners produce lower-quality partitions, because they work from partial information and must make premature decisions be- fore they have a complete view of a vertex’s neighborhood. We introduce CUTTANA, a streaming graph partitioner that partitions massive graphs (Web/Twitter scale) with superior quality compared to existing streaming solutions. CUTTANA uses a novel buffering technique that prevents the premature assignment of vertices to partitions and a scalable coarsening and refinement technique that enables a complete graph view, improving the intermediate assign- ment made by a streaming partitioner. We implemented a parallel version for CUTTANA that offers nearly the same partitioning latency as existing streaming partitioners.\nOur experimental analysis shows that CUTTANA consistently yields better partitioning quality than state-of-the-art streaming vertex partitioners in terms of both edge-cut and communication volume metrics. We also evaluate the workload latencies that re- sult from using CUTTANA and other partitioners in distributed graph analytics and databases. CUTTANA outperforms the other methods in most scenarios (algorithms, datasets). In analytics ap- plications, CUTTANA improves runtime performance by up to 59% compared to various streaming partitioners (i.e., HDRF, Fennel, Ginger, HeiStream). In graph database tasks, CUTTANA results in higher query throughput by up to 23%, without hurting tail latency.", "Artificats": "yes"}, {"Author Names": "Sonia Bergamaschi, Sourav S. Bhowmick, Philippe Bonnet, Surajit Chaudhuri, Xiaoou Ding, Hakan Ferhatosmanoglu, Raul Castro Fernandez, Jana Giceva, Madelon Hulsebos, Alexandra Meliou, Nikos Ntarmos, Themis Palpanas, John Paparrizos, Norman Paton, Subhadeep Sarkar, Giovanni Simonini, Nesime Tatbul, Jiuqi Wei and Jingren Zhou", "Paper ID": "vol18/FrontMatterVol18No12", "Paper Title": "Front Matter", "Abstract": "", "Artificats": "no"}, {"Author Names": "Fengxin Li, Yi Li, Yue Liu, Chao Zhou, Yuan Wang, Xiaoxiang Deng, Wei Xue, Dapeng Liu, Lei Xiao, Haijie Gu, Jie Jiang, Hongyan Liu, Biao Qin, Jun He", "Paper ID": "vol18/p4763-he", "Paper Title": "LEADRE: Multi-Faceted Knowledge Enhanced LLM Empowered Display Advertisement Recommender System", "Abstract": "Display advertising plays a crucial role in benefiting advertisers, publishers, and users. Traditional display advertising systems employ a multi-stage architecture comprising retrieval, coarse ranking, ranking, and re-ranking. However, conventional retrieval methods primarily rely on ID-based learning-to-rank mechanisms, often underutilizing the content information of ads, like ads’ title, and description. This limitation reduces the ability to generate diverse and relevant recommendation lists. \nTo address this challenge, we propose leveraging the extensive world knowledge of large language models (LLMs). However, effectively integrating LLMs into advertising systems presents three key challenges:  (i) How to accurately capture user interests ,  (ii) How to bridge the knowledge gap between LLMs and advertising systems , and (iii) How to efficiently deploy LLMs at scale . To overcome these challenges, we introduce  LEADRE —the  L LM  E mpowered Display  AD vertisement  RE commender system. LEADRE consists of three core components. The  Intent-Aware Prompt Engineering module introduces multi-faceted knowledge and constructs intentaware  <Prompt, Response>  pairs, fine-tuning LLMs to generate ads tailored to users’ personal interests. The  Advertising-Specific Knowledge Alignment  module incorporates auxiliary fine-tuning tasks and Direct Preference Optimization (DPO) to align LLMs with advertising semantics and business objectives. The  Latency-Aware Model Deployment  module integrates a hybrid service framework that balances latency-tolerant and latency-sensitive service, ensuring seamless online deployment. \nExtensive offline experiments validate the effectiveness of LEADRE, demonstrating significant improvements across multiple evaluation metrics. Furthermore, online A/B tests reveal a  1.57%  and  1.17% ∗ Work was done while Fengxin Li was intern at Tencent. † Corresponding authors. \nincrease in Gross Merchandise Value (GMV) for serviced users on WeChat Channels and Moments, respectively. LEADRE has been successfully deployed on both platforms, handling tens of billions of requests daily.", "Artificats": "no"}, {"Author Names": "Marc Baeuerle, Thomas Bodner, Martin Boissier, Tilmann Rabl, Ricardo Salazar Diaz, Florian Schmeller, Nils Straßenburg, Ilin Tolovski, Marcel Weisgut, Wang Yue", "Paper ID": "vol18/p5223-rabl", "Paper Title": "TCO2: Analyzing the Carbon Footprint of Database Server Replacements", "Abstract": "Data centers produce a significant and increasing amount of CO 2 emissions. In the past, these have been predominantly due to energy generation for powering data centers. With the transition to energy sources with lower carbon production, the embodied carbon (i.e., CO 2  and other greenhouse gas emissions during production, transport, and end-of-life) plays an increasing role when planning server lifecycles. While replacing an old server with newer hardware will typically reduce the power consumption of individual tasks, due to better efficiency of modern CPUs, offsetting the embodied carbon of new hardware can take months to tens of years, depending on the grid carbon intensity. In this demo, we invite attendees to interactively analyze the ecological lifecycles of modern database servers for different workloads and grid carbon intensities. Attendees can compare servers with different CPU architectures and estimate ecological deployment cycles for database servers.", "Artificats": "yes"}, {"Author Names": "Pavel Koupil, Jáchym Bártík, Stefan Klessinger, André Conrad, Stefanie Scherzinger", "Paper ID": "vol18/p5227-koupil", "Paper Title": "FDepHunter: Harnessing Negative Examples to Expose Fakes and Reveal Ghosts", "Abstract": "Functional dependency (FD) discovery is fundamental in data profiling. Inevitably, existing approaches can return fake FDs that hold only coincidentally. Moreover, these approaches fall short of identifying ghost FDs that would be observable in a clean dataset, but that remain undetected because of outliers in the data. We introduce an interactive method for dependency discovery that augments an Armstrong relation with additional tuples. We rely on artificially generated  negative examples  that emulate real-world tuples to help expose fake FDs. In addition, we rely on domain experts to confirm that  positive examples  indeed reflect the characteristics of the original dataset. Our tool prototype  FDepHunter  thus provides a novel human-in-the-loop workflow where the set of discovered FDs can be iteratively refined.", "Artificats": "yes"}, {"Author Names": "Hanwen Liu, Federico Spedalieri, Ibrahim Sabek", "Paper ID": "vol18/p5439-liu", "Paper Title": "A Demonstration of Q2O: Quantum-augmented Query Optimizer", "Abstract": "The join order (JO) optimization problem is a key challenge in query optimization. Classical approaches can compute the optimal solution for smaller queries. For larger queries, some heuristic methods trade off plan quality to reduce the exponential search space. Recently, quantum-based methods have been proposed to leverage quantum mechanisms to accelerate exploration; however, encoding problem-specific constraints as penalty terms introduces extra overhead. Moreover, quantum-inspired methods on classical hardware do not harness the true advantages of quantum computation. Furthermore, these methods remain at the simulation stage. \nIn this demonstration, we present the first Quantum-augmented Query Optimizer ( Q 2 O ) that integrates a hybrid quantum-classical approach to solve the JO problem in a real database setup. This demonstration allows conference attendees to interact directly with Q 2 O  by executing queries and viewing detailed execution results (Scenario 1). Users can easily compare plan quality between  Q 2 O and PostgreSQL (Scenario 2). Additionally, they can experiment with quantum parameters to observe their impact (Scenario 3). Experimental results show that the query plan generated by our approach achieves up to a 13x speedup in query execution. The video corresponding to this demonstration is available at   this link .", "Artificats": "yes"}]}, "__N_SSG": true}, "page": "/volumes/[volume]", "query": {"volume": "18"}, "buildId": "MjXE64qEAMyFMl57xHwCF", "assetPrefix": "/pvldb", "isFallback": false, "gsp": true, "scriptLoader": []}</script></body></html>
