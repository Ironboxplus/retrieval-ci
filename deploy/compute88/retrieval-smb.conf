[global]
    server role = standalone server
    workgroup = WORKGROUP
    netbios name = RETRIEVAL88
    server min protocol = SMB3_00
    smb encrypt = required
    map to guest = Never
    interfaces = lo 10.100.100.88/24
    bind interfaces only = yes
    smb ports = 445
    disable netbios = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    usershare allow guests = no
    log file = /var/log/samba/retrieval.%m.log
    max log size = 1000

[lsb]
    path = /home/arc/retrieval-storage
    browseable = yes
    read only = no
    guest ok = no
    valid users = @retrieval-files
    force user = arc
    force group = arc
    create mask = 0664
    directory mask = 0775
    wide links = no
    hosts allow = 127.0.0.1 10.100.100.0/24
    hosts deny = ALL
