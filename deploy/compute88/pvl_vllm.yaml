# vLLM server of PaddleOCR-VL-1.6 for scripts/remote_pvl/pvl_worker.py (native vLLM >= 0.30,
# the server venv; keys are `vllm serve` options, hyphenated).
# The worker lowers `gpu-memory-utilization` to what the card has free minus the pipeline's share.
trust-remote-code: true
served-model-name: PaddleOCR-VL-1.6-0.9B
host: 127.0.0.1
# one API server process: each costs ~1 GB of RAM and the engine core is the limit anyway
api-server-count: 1
max-model-len: 16384
max-num-batched-tokens: 16384
# measured on the 4070 SUPER next to the layout model: 64 sequences keep the engine busy, 32 do not
max-num-seqs: 64
# the same page is never sent twice, so the multimodal cache only costs memory and a copy
mm-processor-cache-gb: 0
# a ceiling (0.34 of the card = 3.9 GiB). Task 1302's log: weights + non-torch 2.02 GiB, peak activation 0.55,
# CUDA graphs 0.06, and at 0.42 a KV cache of 2.3 GiB (134k tokens) of which 64 running sequences used at most 16%.
# 0.34 leaves 1.3 GiB of KV (76k tokens), 3.6x what the sequences use, and gives 1.1 GiB back to Paddle, which
# ran the card out of memory at 0.42 (backend 2.8 + vLLM 4.9 + Paddle ~3.8 GiB: 11.5 of 12.0 GiB sampled).
gpu-memory-utilization: 0.34
