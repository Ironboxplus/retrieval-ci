# Prometheus scrape config — runs on the 4090 (binary via tmux, NOT docker:
# the box's snap-docker is broken). Scrapes everything over loopback; only the
# Prometheus/Grafana UIs bind the lab-overlay IP for lab-internal access (W128).
#
# Targets:
#   retrieval-backend  127.0.0.1:8000/metrics   (FastAPI instrumentator, W128)
#   qdrant             127.0.0.1:6333/metrics   (Qdrant native Prometheus metrics)
#   node-exporter      127.0.0.1:9100/metrics   (host CPU/RAM/disk/net)
#   gpu-exporter       127.0.0.1:9835/metrics   (nvidia_gpu_exporter, nvidia-smi)
#
# Per-user audit is NOT here — it lives in the gateway's structured access logs
# shipped to Loki (Phase 2). Prometheus is aggregate metrics only (cardinality).

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    host: "4090"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: retrieval-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:6333"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: gpu
    static_configs:
      - targets: ["127.0.0.1:9835"]
